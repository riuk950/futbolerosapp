name: CI
on:
  pull_request:
    branches: ["main", "develop", "release"]
  push:
    branches: ["main", "develop", "release"]

env:
  FLAVOR: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

jobs:
  ejecutar_pruebas:
    name: Ejecutar pruebas del proyecto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - name: Instalar dependencias 📦
        run: flutter pub get
        working-directory: .
      - name: Crear archivo .env 📝
        run: |
          if [ "${{ env.FLAVOR }}" = "prod" ]; then
            echo "${{ secrets.ENV_PROD }}" > .env.prod
            echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID_PROD }}" >> .env.prod
          else
            echo "${{ secrets.ENV_DEV }}" > .env.dev
            echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID_DEV }}" >> .env.dev
          fi
      - name: Crear archivos .env si faltan 🧩
        run: |
          touch .env.dev
          touch .env.prod
      - name: Analizar código 🧐
        run: flutter analyze
        working-directory: .
      - name: Ejecutar pruebas 🧪
        run: flutter test --flavor ${{ env.FLAVOR }}
        working-directory: .