name: CI & Firebase Distribution

on:
  push:
    branches: ["main", "develop", "release"]
  pull_request:
    branches: ["main", "develop", "release"]

env:
  FLAVOR: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

jobs:
  # ------------------------------------------------------
  # JOB 1: Pruebas y Análisis de Código
  # ------------------------------------------------------
  ejecutar_pruebas:
    name: Ejecutar pruebas del proyecto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Instalar dependencias 📦
        run: flutter pub get

      - name: Crear archivos .env 📝
        run: |
          if [ "${{ env.FLAVOR }}" = "prod" ]; then
            echo "${{ secrets.ENV_PROD }}" > .env.prod
            echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID_PROD }}" >> .env.prod
          else
            echo "${{ secrets.ENV_DEV }}" > .env.dev
            echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID_DEV }}" >> .env.dev
          fi
          touch .env.dev
          touch .env.prod

      - name: Analizar código 🧐
        run: flutter analyze

      - name: Ejecutar pruebas 🧪
        run: flutter test --flavor ${{ env.FLAVOR }}

  # ------------------------------------------------------
  # JOB 2: Compilar y Distribuir a Firebase
  # ------------------------------------------------------
  distribuir_firebase:
    name: Compilar APK y Subir a Firebase App Distribution
    needs: ejecutar_pruebas
    # Se ejecuta solo en eventos push (evita generar APKs pesados en Pull Requests)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Instalar dependencias 📦
        run: flutter pub get

      - name: Crear archivos .env 📝
        run: |
          if [ "${{ env.FLAVOR }}" = "prod" ]; then
            echo "${{ secrets.ENV_PROD }}" > .env.prod
            echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID_PROD }}" >> .env.prod
          else
            echo "${{ secrets.ENV_DEV }}" > .env.dev
            echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID_DEV }}" >> .env.dev
          fi
          touch .env.dev
          touch .env.prod

      # 1. Compilar APK según el Flavor activo
      - name: Compilar APK 🔨
        run: flutter build apk --flavor ${{ env.FLAVOR }} --target lib/main.dart

      # 2. Asignar App ID dinámicamente según el entorno
      - name: Configurar App ID de Firebase
        id: set_app_id
        run: |
          if [ "${{ env.FLAVOR }}" = "prod" ]; then
            echo "APP_ID=${{ secrets.FIREBASE_APP_ID_PROD }}" >> $GITHUB_ENV
          else
            echo "APP_ID=${{ secrets.FIREBASE_APP_ID_DEV }}" >> $GITHUB_ENV
          fi

      # 3. Subir APK a Firebase App Distribution
      - name: Distribuir APK a Firebase 🚀
        uses: w9jds/firebase-action@v13.4.0
        with:
          args: >
            appdistribution:distribute build/app/outputs/flutter-apk/app-${{ env.FLAVOR }}-release.apk
            --app "${{ env.APP_ID }}"
            --groups "testers-internos"
            --release-notes "Nueva versión desplegada automáticamente desde la rama ${{ github.ref_name }}."
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}